version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: gaming-crafty_proxy_1
      APP_PORT: 80

  proxy:
    image: nginx:1.25-alpine
    restart: on-failure
    depends_on:
      - server
    volumes:
      - ${APP_DATA_DIR}/data/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  server:
    image: arcadiatechnology/crafty-4:4.4.9
    restart: on-failure
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/app/config:/crafty/app/config
      - ${APP_DATA_DIR}/data/logs:/crafty/logs
      - ${APP_DATA_DIR}/data/import:/crafty/import
      - ${APP_DATA_DIR}/data/backups:/crafty/backups
      - ${APP_DATA_DIR}/data/servers:/crafty/servers
    ports:
      - "19132:19132/udp"
      - "25500-25600:25500-25600"